<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書閣・閱歷手帳</title>
    <!-- iOS iPhone 主畫面圖示 (Apple Touch Icon) & PWA 設定 -->
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='112' fill='%23DDC9B4'/><rect x='48' y='48' width='416' height='416' rx='88' fill='%23FAF8F5' stroke='%237A6C5D' stroke-width='16'/><path d='M100 240 Q256 190 412 240 L412 400 Q256 350 100 400 Z' fill='%23FFFFFF' stroke='%232A3D45' stroke-width='18' stroke-linejoin='round'/><path d='M256 210 L256 375' stroke='%232A3D45' stroke-width='18' stroke-linecap='round'/><path d='M130 280 Q190 260 230 280' stroke='%23C17C74' stroke-width='12' stroke-linecap='round' fill='none'/><path d='M130 330 Q190 310 230 330' stroke='%237A6C5D' stroke-width='12' stroke-linecap='round' fill='none'/><path d='M285 280 Q325 260 380 280' stroke='%23C17C74' stroke-width='12' stroke-linecap='round' fill='none'/><path d='M285 330 Q325 310 380 330' stroke='%237A6C5D' stroke-width='12' stroke-linecap='round' fill='none'/><path d='M256 100 Q256 160 256 195' stroke='%232A3D45' stroke-width='14' stroke-linecap='round' fill='none'/><path d='M256 150 Q200 120 180 80 Q220 70 256 125' fill='%23DDC9B4' stroke='%232A3D45' stroke-width='10' stroke-linejoin='round'/><path d='M256 135 Q310 105 330 65 Q290 55 256 110' fill='%23BCAC9B' stroke='%232A3D45' stroke-width='10' stroke-linejoin='round'/></svg>">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="閱歷手帳">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Zen Maru Gothic (備用) & 何某手寫體 (Homou Font Webfont/Font-Family CDN) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons for basic control icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#DDC9B4',        /* 暖沙米白/駝色 #DDC9B4 */
                            card: '#FFFFFF',      /* 純白卡片 */
                            primary: '#7A6C5D',   /* 溫潤可可灰棕 #7A6C5D */
                            blue: '#2A3D45',      /* 深石青藍 #2A3D45 */
                            rose: '#C17C74',      /* 乾燥玫瑰赭紅 #C17C74 */
                            dark: '#2A3D45',      /* 深石青藍文字 */
                            accent: '#BCAC9B',    /* 灰褐沙色 #BCAC9B */
                            tape: '#BCAC9B'       /* 和紙膠帶色 */
                        }
                    },
                    fontFamily: {
                        hand: ['"Homou Font"', '"何某手寫體"', '"Zen Maru Gothic"', 'sans-serif'],
                        cute: ['"Homou Font"', '"何某手寫體"', '"Zen Maru Gothic"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* 引入何某手寫體 Web Font */
        @font-face {
            font-family: 'Homou Font';
            src: url('https://cdn.jsdelivr.net/gh/chiron-fonts/homou-font@main/HomouFont.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/chiron-fonts/homou-font@main/HomouFont.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            background-color: #F7F5F0;
            color: #2A3D45;
            font-family: 'Homou Font', '何某手寫體', 'Zen Maru Gothic', sans-serif;
            background-image: none;
            background-attachment: fixed;
        }

        /* 莫蘭迪色系和紙膠帶裝飾風格 */
        .washi-tape {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-1.2deg);
            width: 100px;
            height: 24px;
            background: #BCAC9B;
            opacity: 0.95;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(42,61,69,0.08) 8px, rgba(42,61,69,0.08) 16px);
            box-shadow: 0 1px 3px rgba(42, 61, 69, 0.15);
            z-index: 15;
            border-left: 2px dashed rgba(42,61,69,0.2);
            border-right: 2px dashed rgba(42,61,69,0.2);
            border-radius: 4px;
        }

        .journal-card {
            background: #FFFFFF;
            border: 2px solid #7A6C5D;
            border-radius: 24px;
            box-shadow: 0 8px 22px -6px rgba(42, 61, 69, 0.08);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .journal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px -8px rgba(42, 61, 69, 0.16);
            border-color: #2A3D45;
        }

        .tab-btn {
            position: relative;
            transition: all 0.2s ease;
        }

        .tab-active {
            color: #2A3D45;
            font-weight: 700;
        }

        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 5%;
            right: 5%;
            height: 5px;
            background: #2A3D45;
            border-radius: 10px;
            opacity: 0.95;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .font-handwriting {
            font-family: 'Homou Font', '何某手寫體', 'Zen Maru Gothic', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-morandi-primary/30">

    <!-- 全站通用手繪風 SVG 圖標庫 (無 Emoji) -->
    <svg class="hidden">
        <!-- 小書本 SVG -->
        <g id="svg-hand-book">
            <path d="M 15 25 Q 40 18 65 25 L 65 65 Q 40 58 15 65 Z" fill="#FFFFFF" stroke="#2A3D45" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M 40 21 L 40 61" stroke="#2A3D45" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M 20 33 Q 30 29 35 33" stroke="#7A6C5D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M 20 42 Q 30 38 35 42" stroke="#7A6C5D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M 45 33 Q 55 29 60 33" stroke="#7A6C5D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <path d="M 45 42 Q 55 38 60 42" stroke="#7A6C5D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        </g>
        
        <!-- 手繪植物 SVG -->
        <g id="svg-hand-sprout">
            <path d="M 40 65 Q 40 40 40 25" stroke="#2A3D45" stroke-width="2.5" stroke-linecap="round" fill="none"/>
            <path d="M 40 40 Q 25 30 20 18 Q 32 15 40 32" fill="#DDC9B4" stroke="#2A3D45" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 40 35 Q 55 25 60 13 Q 48 10 40 27" fill="#BCAC9B" stroke="#2A3D45" stroke-width="2" stroke-linejoin="round"/>
        </g>

        <!-- 手繪星芒 SVG -->
        <g id="svg-hand-sparkle">
            <path d="M 40 10 Q 40 40 10 40 Q 40 40 40 70 Q 40 40 70 40 Q 40 40 40 10 Z" fill="#DDC9B4" stroke="#2A3D45" stroke-width="2" stroke-linejoin="round"/>
        </g>
    </svg>

    <!-- 頂部留白 -->
    <header class="w-full pt-8 pb-2 px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <!-- 已完結書籍數量統計勳章 -->
            <div class="flex items-center gap-2 bg-white/90 border border-morandi-primary px-3.5 py-1.5 rounded-full shadow-sm font-cute text-xs text-morandi-dark">
                <svg class="w-4 h-4 text-morandi-blue" viewBox="0 0 80 80"><use href="#svg-hand-book"/></svg>
                <span>已完結作品：</span>
                <span id="finished-count" class="font-bold text-morandi-blue text-sm">0</span>
                <span class="text-[11px] text-morandi-primary">本</span>
            </div>

            <!-- 簡約手帳圖標點綴 -->
            <div class="flex items-center gap-1.5 opacity-60">
                <svg class="w-5 h-5 text-morandi-rose" viewBox="0 0 80 80"><use href="#svg-hand-sprout"/></svg>
            </div>
        </div>
    </header>

    <!-- 主體內容區 -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 pb-20 pt-1">

        <!-- 導覽分頁 Tabs（大類分頁） -->
        <div class="flex items-center justify-between border-b-2 border-morandi-blue/40 mb-6 pb-2 overflow-x-auto no-scrollbar">
            <div class="flex space-x-6 sm:space-x-8 text-base font-handwriting" id="tabs-container">
                <!-- 動態生成大類分頁 -->
            </div>
            <button onclick="openTabManageModal()" class="flex-shrink-0 text-xs px-4 py-1.5 rounded-full bg-white text-morandi-dark border border-morandi-blue/50 hover:bg-morandi-accent transition flex items-center gap-1.5 shadow-sm font-cute ml-4">
                <svg class="w-3.5 h-3.5 text-morandi-rose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>管理類型分頁</span>
            </button>
        </div>

        <!-- 子標籤快速過濾列 (點擊特定大類分頁時展開) -->
        <div id="subtag-filter-bar" class="hidden mb-6 flex flex-wrap items-center gap-2 bg-white/90 p-3.5 rounded-2xl border border-morandi-primary shadow-sm">
            <div class="flex items-center gap-1 mr-1">
                <svg class="w-4 h-4 text-morandi-rose" viewBox="0 0 80 80"><use href="#svg-hand-sparkle"/></svg>
                <span class="text-xs font-cute text-morandi-rose font-medium">子標籤過濾：</span>
            </div>
            <div id="subtag-filter-chips" class="flex flex-wrap gap-1.5">
                <!-- 動態子標籤過濾按鈕 -->
            </div>
        </div>

        <!-- 閱讀狀態過濾與搜尋欄區塊 -->
        <div class="bg-white rounded-3xl p-4 sm:p-5 mb-8 border-2 border-morandi-primary shadow-sm flex flex-col gap-4 relative">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-morandi-primary/30 pb-3">
                <div class="flex flex-wrap items-center gap-1.5 font-cute text-xs">
                    <span class="text-morandi-primary font-bold mr-1 flex items-center gap-1">
                        <i class="fa-solid fa-filter text-[11px] text-morandi-rose"></i>
                        <span>閱讀狀態：</span>
                    </span>
                    <button onclick="setStatusFilter('ALL')" id="status-btn-ALL" class="px-3 py-1 rounded-full border transition font-bold shadow-sm">全部</button>
                    <button onclick="setStatusFilter('FINISHED')" id="status-btn-FINISHED" class="px-3 py-1 rounded-full border transition">已完結</button>
                    <button onclick="setStatusFilter('READING')" id="status-btn-READING" class="px-3 py-1 rounded-full border transition">閱讀中</button>
                    <button onclick="setStatusFilter('WANT_TO_READ')" id="status-btn-WANT_TO_READ" class="px-3 py-1 rounded-full border transition">欲讀書單</button>
                </div>

                <!-- 作者快速過濾標籤 -->
                <div id="author-filter-badge" class="hidden items-center gap-1.5 bg-morandi-accent/40 border border-morandi-primary px-3 py-1 rounded-full font-cute text-xs text-morandi-dark shadow-sm">
                    <span class="text-morandi-primary">作者：</span>
                    <span id="author-filter-name" class="font-bold text-morandi-blue"></span>
                    <button onclick="clearAuthorFilter()" class="ml-1 text-morandi-rose hover:text-rose-600 focus:outline-none" title="清除作者篩選">
                        <i class="fa-solid fa-circle-xmark text-xs"></i>
                    </button>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="relative w-full sm:w-80">
                    <svg class="w-4 h-4 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-morandi-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" oninput="renderBooks()" placeholder="搜尋書名、作者或子標籤..." 
                           class="w-full pl-10 pr-4 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-full text-xs text-morandi-dark focus:outline-none focus:border-morandi-blue transition font-cute">
                </div>

                <button onclick="openBookModal()" class="w-full sm:w-auto bg-morandi-blue border border-morandi-dark/20 hover:bg-morandi-primary text-white text-xs font-cute font-bold px-6 py-2.5 rounded-full shadow-sm flex items-center justify-center gap-2 transition transform active:scale-95">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 80 80"><use href="#svg-hand-book"/></svg>
                    <span>記下一本書</span>
                </button>
            </div>
        </div>

        <!-- 書籍列表 Grid 區域 -->
        <div id="books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 動態書籍卡片 -->
        </div>

        <!-- 空白狀態提示 -->
        <div id="empty-state" class="hidden text-center py-16 bg-white/70 rounded-3xl border-2 border-dashed border-morandi-primary my-4">
            <div class="w-16 h-16 mx-auto mb-2 flex items-center justify-center">
                <svg class="w-12 h-12 text-morandi-primary" viewBox="0 0 80 80"><use href="#svg-hand-book"/></svg>
            </div>
            <h3 class="text-sm font-handwriting text-morandi-dark font-bold mb-1">這個分類還沒有紀錄呢</h3>
            <p class="text-xs text-morandi-rose font-cute max-w-xs mx-auto mb-4">點擊「記下一本書」，為您的手帳頁留下溫暖的閱讀足跡吧。</p>
            <button onclick="openBookModal()" class="text-xs font-cute bg-morandi-tape border border-morandi-dark/20 text-morandi-dark px-5 py-2 rounded-full hover:bg-morandi-primary transition shadow-sm font-bold">
                寫下第一筆紀錄
            </button>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- MODAL 1: 新增 / 編輯書籍 Modal -->
    <!-- ========================================== -->
    <div id="book-modal" class="fixed inset-0 bg-morandi-dark/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-xl border-2 border-morandi-primary overflow-hidden transform transition-all my-8 relative">
            <div class="washi-tape"></div>

            <div class="px-6 py-4 bg-morandi-accent border-b border-morandi-primary flex justify-between items-center">
                <h3 class="font-handwriting font-bold text-morandi-dark text-lg flex items-center gap-2" id="book-modal-title">
                    <svg class="w-5 h-5 text-morandi-blue" viewBox="0 0 80 80"><use href="#svg-hand-book"/></svg>
                    <span>新增閱讀紀錄</span>
                </h3>
                <button onclick="closeBookModal()" class="text-morandi-rose hover:text-morandi-dark text-sm p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="book-form" onsubmit="saveBook(event)" class="p-6 space-y-4 max-h-[78vh] overflow-y-auto font-cute text-xs">
                <input type="hidden" id="book-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-morandi-dark mb-1">小說名稱 <span class="text-rose-400">*</span></label>
                        <input type="text" id="book-title" required placeholder="例如：春山微雨" class="w-full px-3 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                    </div>
                    <div>
                        <label class="block font-medium text-morandi-dark mb-1">作者</label>
                        <input type="text" id="book-author" placeholder="作者姓名" class="w-full px-3 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-morandi-dark mb-1">所屬小說類型</label>
                        <select id="book-category" class="w-full px-3 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                            <!-- 動態載入類型 -->
                        </select>
                    </div>
                    <div>
                        <label class="block font-medium text-morandi-dark mb-1">閱讀狀態</label>
                        <select id="book-status" class="w-full px-3 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                            <option value="READING">閱讀中</option>
                            <option value="FINISHED">已完結</option>
                            <option value="WANT_TO_READ">欲讀書單</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-morandi-dark mb-1">星級評分 (1-5)</label>
                        <div class="flex items-center space-x-1 py-1 cursor-pointer" id="rating-stars">
                            <!-- SVG 星星 -->
                        </div>
                        <input type="hidden" id="book-rating" value="5">
                    </div>
                    <div>
                        <label class="block font-medium text-morandi-dark mb-1">閱讀日期</label>
                        <input type="date" id="book-start-date" class="w-full px-3 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                    </div>
                </div>

                <!-- 子標籤點選與刪除管理 -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block font-medium text-morandi-dark">子標籤 (點選勾選，或點擊「×」刪除標籤)</label>
                    </div>
                    <div id="tag-picker-container" class="flex flex-wrap gap-1.5 p-3 bg-morandi-bg/40 border border-morandi-primary rounded-xl mb-2 min-h-[48px] items-center">
                        <!-- 點選標籤 chips (帶刪除按鈕) -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="new-tag-input" placeholder="輸入新標籤名稱..." class="flex-grow px-3 py-1.5 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                        <button type="button" onclick="addNewCustomTag()" class="px-4 py-1.5 bg-morandi-tape text-morandi-dark font-bold rounded-xl hover:bg-morandi-primary transition border border-morandi-dark/20">新增標籤</button>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-morandi-dark mb-1">封面圖片網址 (可選)</label>
                    <input type="url" id="book-cover" placeholder="https://..." class="w-full px-3 py-2 bg-morandi-bg/40 border border-morandi-primary rounded-xl focus:outline-none focus:border-morandi-blue">
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeBookModal()" class="px-4 py-2 text-morandi-rose hover:bg-morandi-accent rounded-full transition">取消</button>
                    <button type="submit" class="px-6 py-2 text-white font-bold bg-morandi-blue border border-morandi-dark/20 rounded-full shadow-sm hover:bg-morandi-primary transition">保存紀錄</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 2: 小說類型分頁管理 Modal -->
    <!-- ========================================== -->
    <div id="tab-manage-modal" class="fixed inset-0 bg-morandi-dark/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border-2 border-morandi-primary overflow-hidden font-cute">
            <div class="px-6 py-4 bg-morandi-accent border-b border-morandi-primary flex justify-between items-center">
                <h3 class="font-handwriting font-bold text-morandi-dark text-base flex items-center gap-2">
                    <svg class="w-4 h-4 text-morandi-blue" viewBox="0 0 80 80"><use href="#svg-hand-sprout"/></svg>
                    <span>管理小說類型分頁</span>
                </h3>
                <button onclick="closeTabManageModal()" class="text-morandi-rose hover:text-morandi-dark">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <p class="text-xs text-morandi-rose leading-relaxed">您可以自由自訂大類分頁名稱，點擊下方按鈕新增喜愛的分頁。</p>
                
                <div class="space-y-3" id="tab-edit-list">
                    <!-- 動態編輯列表 -->
                </div>

                <button onclick="addNewTabField()" class="w-full py-2 border-2 border-dashed border-morandi-blue/50 rounded-2xl text-xs text-morandi-blue font-bold hover:bg-morandi-accent transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>新增大類分頁</span>
                </button>
            </div>

            <div class="px-6 py-3 bg-morandi-bg/40 border-t border-morandi-primary flex justify-end gap-2">
                <button onclick="closeTabManageModal()" class="px-4 py-1.5 text-xs text-morandi-rose hover:bg-morandi-accent rounded-full transition">取消</button>
                <button onclick="saveTabsConfig()" class="px-5 py-1.5 text-xs text-white font-bold bg-morandi-blue border border-morandi-dark/20 rounded-full hover:bg-morandi-primary transition">保存分頁</button>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL 3: 閱讀詳情檢視 Modal -->
    <!-- ========================================== -->
    <div id="view-book-modal" class="fixed inset-0 bg-morandi-dark/30 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl border-2 border-morandi-primary overflow-hidden relative my-8 font-cute">
            <div class="washi-tape"></div>
            
            <div id="view-modal-content" class="p-6 sm:p-7">
                <!-- 動態詳情內容 -->
            </div>
            <div class="px-6 py-4 bg-morandi-bg/40 border-t border-morandi-primary flex justify-between items-center">
                <button id="view-delete-btn" class="text-xs text-rose-400 hover:text-rose-600 flex items-center gap-1 transition">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>刪除紀錄</span>
                </button>
                <div class="flex gap-2">
                    <button id="view-edit-btn" class="px-4 py-1.5 bg-morandi-blue text-white border border-morandi-dark/20 font-bold rounded-full text-xs hover:bg-morandi-primary transition">
                        編輯
                    </button>
                    <button onclick="closeViewModal()" class="px-4 py-1.5 bg-white text-morandi-dark border border-morandi-primary rounded-full text-xs hover:bg-morandi-accent transition">
                        關閉
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT APP LOGIC -->
    <!-- ========================================== -->
    <script>
        const DEFAULT_TABS = [
            { id: 'all', name: '全部書籍' },
            { id: 'romance', name: '言情小說' },
            { id: 'bl', name: 'BL小說' }
        ];

        const DEFAULT_TAGS = ['穿越', '快穿', '甜寵', '校園', '系統', '古言', '現言', '爽文', '虐心', '重生'];

        const DEFAULT_BOOKS = [
            {
                id: '1',
                title: '快穿之攻略對象又黑化了',
                author: '青衫落',
                category: 'BL小說',
                status: 'FINISHED',
                rating: 5,
                startDate: '2026-03-01',
                tags: ['快穿', '甜寵', '系統'],
                cover: ''
            },
            {
                id: '2',
                title: '春山微雨',
                author: '江上月',
                category: '言情小說',
                status: 'READING',
                rating: 4,
                startDate: '2026-03-05',
                tags: ['穿越', '古言'],
                cover: ''
            }
        ];

        let tabs = JSON.parse(localStorage.getItem('morandi_novel_tabs')) || DEFAULT_TABS;
        let availableTags = JSON.parse(localStorage.getItem('morandi_novel_available_tags')) || DEFAULT_TAGS;
        let books = JSON.parse(localStorage.getItem('morandi_novel_books')) || DEFAULT_BOOKS;
        
        let currentTabId = 'all';
        let currentSubTagFilter = 'ALL';
        let currentStatusFilter = 'ALL';
        let currentAuthorFilter = null;
        let selectedTagsForForm = [];

        window.onload = function() {
            renderTabs();
            renderCategorySelectOptions();
            renderRatingStarsInput();
            renderStatusFilterButtons();
            renderBooks();
            updateFinishedBookCount();
        };

        function updateFinishedBookCount() {
            const countEl = document.getElementById('finished-count');
            if (countEl) {
                const finishedCount = books.filter(b => b.status === 'FINISHED').length;
                countEl.innerText = finishedCount;
            }
        }

        function getStarSvg(filled = true, size = "w-4 h-4") {
            if (filled) {
                return `<svg class="${size} text-morandi-blue inline-block fill-current" viewBox="0 0 24 24">
                    <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                </svg>`;
            }
            return `<svg class="${size} text-morandi-primary inline-block stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>`;
        }

        function getStatusBadgeSvgHtml(status) {
            if (status === 'READING') {
                return `<span class="inline-flex items-center gap-1 text-[11px] px-2.5 py-0.5 rounded-full bg-morandi-accent text-morandi-dark font-cute font-bold border border-morandi-blue">閱讀中</span>`;
            } else if (status === 'FINISHED') {
                return `<span class="inline-flex items-center gap-1 text-[11px] px-2.5 py-0.5 rounded-full bg-morandi-blue text-white font-cute font-bold border border-morandi-blue">已完結</span>`;
            } else {
                return `<span class="inline-flex items-center gap-1 text-[11px] px-2.5 py-0.5 rounded-full bg-white text-morandi-primary font-cute font-bold border border-morandi-primary">欲讀</span>`;
            }
        }

        function filterByAuthor(authorName) {
            if (!authorName) return;
            currentAuthorFilter = authorName;
            renderAuthorFilterBadge();
            renderBooks();
        }

        function clearAuthorFilter() {
            currentAuthorFilter = null;
            renderAuthorFilterBadge();
            renderBooks();
        }

        function renderAuthorFilterBadge() {
            const badge = document.getElementById('author-filter-badge');
            const nameEl = document.getElementById('author-filter-name');
            if (currentAuthorFilter) {
                nameEl.innerText = currentAuthorFilter;
                badge.classList.remove('hidden');
                badge.classList.add('flex');
            } else {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';

            tabs.forEach(tab => {
                const button = document.createElement('button');
                button.className = `pb-1.5 tab-btn whitespace-nowrap flex items-center gap-1.5 ${currentTabId === tab.id ? 'tab-active' : 'text-morandi-primary hover:text-morandi-dark'}`;
                button.innerText = tab.name;
                button.onclick = () => switchTab(tab.id);
                container.appendChild(button);
            });
        }

        function switchTab(tabId) {
            currentTabId = tabId;
            currentSubTagFilter = 'ALL';
            renderTabs();
            renderSubTagFilterBar();
            renderBooks();
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            renderStatusFilterButtons();
            renderBooks();
        }

        function renderStatusFilterButtons() {
            const statuses = ['ALL', 'FINISHED', 'READING', 'WANT_TO_READ'];
            statuses.forEach(st => {
                const btn = document.getElementById(`status-btn-${st}`);
                if (btn) {
                    if (currentStatusFilter === st) {
                        btn.className = 'px-3 py-1 rounded-full text-xs font-cute font-bold bg-morandi-blue text-white border border-morandi-blue shadow-sm';
                    } else {
                        btn.className = 'px-3 py-1 rounded-full text-xs font-cute bg-white text-morandi-dark border border-morandi-primary hover:bg-morandi-accent/50';
                    }
                }
            });
        }

        function renderSubTagFilterBar() {
            const bar = document.getElementById('subtag-filter-bar');
            const chipsContainer = document.getElementById('subtag-filter-chips');

            const activeTab = tabs.find(t => t.id === currentTabId);
            if (!activeTab || activeTab.id === 'all') {
                bar.classList.add('hidden');
                return;
            }

            bar.classList.remove('hidden');
            chipsContainer.innerHTML = '';

            const allChip = document.createElement('button');
            allChip.className = `text-xs px-3 py-1 rounded-full font-cute transition ${currentSubTagFilter === 'ALL' ? 'bg-morandi-blue text-white font-bold shadow-sm' : 'bg-white text-morandi-dark border border-morandi-primary hover:bg-morandi-accent'}`;
            allChip.innerText = '全部子標籤';
            allChip.onclick = () => { currentSubTagFilter = 'ALL'; renderSubTagFilterBar(); renderBooks(); };
            chipsContainer.appendChild(allChip);

            availableTags.forEach(tag => {
                const isSelected = currentSubTagFilter === tag;
                const chip = document.createElement('button');
                chip.className = `text-xs px-3 py-1 rounded-full font-cute transition ${isSelected ? 'bg-morandi-blue text-white font-bold shadow-sm' : 'bg-white text-morandi-dark border border-morandi-primary hover:bg-morandi-accent'}`;
                chip.innerText = `# ${tag}`;
                chip.onclick = () => { currentSubTagFilter = tag; renderSubTagFilterBar(); renderBooks(); };
                chipsContainer.appendChild(chip);
            });
        }

        function renderCategorySelectOptions() {
            const formSelect = document.getElementById('book-category');
            formSelect.innerHTML = '';
            tabs.filter(t => t.id !== 'all').forEach(tab => {
                formSelect.innerHTML += `<option value="${tab.name}">${tab.name}</option>`;
            });
        }

        function renderRatingStarsInput() {
            const container = document.getElementById('rating-stars');
            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += `<button type="button" onclick="setRating(${i})" class="p-0.5 focus:outline-none">${getStarSvg(true, 'w-5 h-5')}</button>`;
            }
            container.innerHTML = html;
        }

        function renderTagPicker() {
            const container = document.getElementById('tag-picker-container');
            container.innerHTML = '';

            if (availableTags.length === 0) {
                container.innerHTML = '<span class="text-xs text-morandi-rose italic">尚無標籤，可在下方新增</span>';
                return;
            }

            availableTags.forEach(tag => {
                const isChecked = selectedTagsForForm.includes(tag);
                
                const chipWrapper = document.createElement('div');
                chipWrapper.className = `inline-flex items-center rounded-xl border text-xs font-cute transition ${isChecked ? 'bg-morandi-blue text-white font-bold border-morandi-blue shadow-sm' : 'bg-white text-morandi-dark border-morandi-primary hover:bg-morandi-accent'}`;
                
                const toggleBtn = document.createElement('button');
                toggleBtn.type = 'button';
                toggleBtn.className = 'px-2.5 py-1 focus:outline-none';
                toggleBtn.innerText = `# ${tag}`;
                toggleBtn.onclick = () => toggleTagSelection(tag);

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = `pr-2 pl-0.5 py-1 hover:text-rose-500 focus:outline-none ${isChecked ? 'text-white/80' : 'text-morandi-rose'}`;
                deleteBtn.title = '刪除此標籤';
                deleteBtn.innerHTML = '<i class="fa-solid fa-xmark text-[10px]"></i>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeAvailableTag(tag);
                };

                chipWrapper.appendChild(toggleBtn);
                chipWrapper.appendChild(deleteBtn);
                container.appendChild(chipWrapper);
            });
        }

        function removeAvailableTag(tagToRemove) {
            availableTags = availableTags.filter(t => t !== tagToRemove);
            selectedTagsForForm = selectedTagsForForm.filter(t => t !== tagToRemove);
            localStorage.setItem('morandi_novel_available_tags', JSON.stringify(availableTags));
            renderTagPicker();
            renderSubTagFilterBar();
        }

        function toggleTagSelection(tag) {
            if (selectedTagsForForm.includes(tag)) {
                selectedTagsForForm = selectedTagsForForm.filter(t => t !== tag);
            } else {
                selectedTagsForForm.push(tag);
            }
            renderTagPicker();
        }

        function addNewCustomTag() {
            const input = document.getElementById('new-tag-input');
            const val = input.value.trim();
            if (val && !availableTags.includes(val)) {
                availableTags.push(val);
                localStorage.setItem('morandi_novel_available_tags', JSON.stringify(availableTags));
                selectedTagsForForm.push(val);
                input.value = '';
                renderTagPicker();
                renderSubTagFilterBar();
            }
        }

        function renderBooks() {
            const grid = document.getElementById('books-grid');
            const emptyState = document.getElementById('empty-state');
            const searchKeyword = document.getElementById('search-input').value.trim().toLowerCase();

            grid.innerHTML = '';

            const activeTabObj = tabs.find(t => t.id === currentTabId);

            const filteredBooks = books.filter(book => {
                if (currentTabId !== 'all' && activeTabObj) {
                    if (book.category !== activeTabObj.name) return false;
                }

                if (currentStatusFilter !== 'ALL') {
                    if (book.status !== currentStatusFilter) return false;
                }

                if (currentSubTagFilter !== 'ALL') {
                    if (!book.tags || !book.tags.includes(currentSubTagFilter)) return false;
                }

                if (currentAuthorFilter) {
                    if ((book.author || '').trim() !== currentAuthorFilter.trim()) return false;
                }

                if (searchKeyword) {
                    const titleMatch = book.title.toLowerCase().includes(searchKeyword);
                    const authorMatch = (book.author || '').toLowerCase().includes(searchKeyword);
                    const tagMatch = (book.tags || []).some(t => t.toLowerCase().includes(searchKeyword));
                    return titleMatch || authorMatch || tagMatch;
                }

                return true;
            });

            if (filteredBooks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredBooks.forEach(book => {
                    grid.appendChild(createBookCard(book));
                });
            }
        }

        function createBookCard(book) {
            const card = document.createElement('div');
            card.className = 'journal-card flex flex-col justify-between relative overflow-hidden group p-4 sm:p-5';

            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += getStarSvg(i <= book.rating, 'w-3.5 h-3.5');
            }

            const tagsHtml = (book.tags || []).map(t => `<span class="text-[10px] px-2 py-0.5 rounded-md bg-morandi-accent/50 border border-morandi-primary text-morandi-dark font-cute">#${t}</span>`).join(' ');

            const coverContent = book.cover 
                ? `<img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover rounded-xl shadow-sm" onerror="this.src='https://placehold.co/300x400/DDC9B4/2A3D45?text=封面'">`
                : `<div class="w-full h-full flex flex-col items-center justify-center p-2 text-center rounded-xl border border-dashed border-morandi-primary/50 bg-morandi-bg/50">
                        <svg class="w-7 h-7 text-morandi-blue mb-1" viewBox="0 0 80 80"><use href="#svg-hand-book"/></svg>
                        <span class="font-handwriting text-[11px] font-bold text-morandi-dark line-clamp-2">${book.title}</span>
                   </div>`;

            const authorHtml = book.author 
                ? `<span onclick="filterByAuthor('${book.author.replace(/'/g, "\\'")}')" class="cursor-pointer hover:underline hover:text-morandi-blue transition">作者：${book.author}</span>`
                : `<span>未知作者</span>`;

            card.innerHTML = `
                <div class="flex gap-4">
                    <div class="w-20 h-28 flex-shrink-0 relative shadow-sm rounded-xl overflow-hidden">
                        ${coverContent}
                    </div>

                    <div class="flex-grow flex flex-col justify-between overflow-hidden">
                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <span class="text-[10px] px-2.5 py-0.5 rounded-full bg-morandi-accent text-morandi-dark font-cute font-bold">${book.category || '未分類'}</span>
                                ${getStatusBadgeSvgHtml(book.status)}
                            </div>
                            <h4 class="font-handwriting font-bold text-morandi-dark text-base line-clamp-1 group-hover:text-morandi-rose transition cursor-pointer" onclick="openViewModal('${book.id}')">${book.title}</h4>
                            <p class="text-xs text-morandi-primary font-cute mt-0.5 mb-1.5">${authorHtml}</p>
                            <div class="flex items-center gap-0.5 mb-2">
                                ${starsHtml}
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-1">
                            ${tagsHtml}
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-t border-morandi-primary/40 flex justify-between items-center">
                    <span class="text-[11px] text-morandi-primary font-cute">閱讀日期：${book.startDate || '未紀錄'}</span>
                    <button onclick="openViewModal('${book.id}')" class="text-[11px] font-cute text-morandi-rose hover:text-morandi-dark transition inline-flex items-center gap-1 font-medium">
                        <span>展開手帳頁</span>
                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
            `;

            return card;
        }

        function openBookModal(bookId = null) {
            const modal = document.getElementById('book-modal');
            const modalTitle = document.getElementById('book-modal-title');
            const form = document.getElementById('book-form');

            renderCategorySelectOptions();

            if (bookId) {
                const book = books.find(b => b.id === bookId);
                if (!book) return;

                modalTitle.querySelector('span').innerText = '編輯小說紀錄';
                document.getElementById('book-id').value = book.id;
                document.getElementById('book-title').value = book.title;
                document.getElementById('book-author').value = book.author || '';
                document.getElementById('book-category').value = book.category;
                document.getElementById('book-status').value = book.status;
                document.getElementById('book-start-date').value = book.startDate || '';
                document.getElementById('book-cover').value = book.cover || '';
                selectedTagsForForm = [...(book.tags || [])];
                setRating(book.rating || 5);
            } else {
                modalTitle.querySelector('span').innerText = '記下一本小說';
                form.reset();
                document.getElementById('book-id').value = '';
                
                const activeTabObj = tabs.find(t => t.id === currentTabId);
                if (activeTabObj && activeTabObj.id !== 'all') {
                    document.getElementById('book-category').value = activeTabObj.name;
                }
                selectedTagsForForm = [];
                setRating(5);
            }

            renderTagPicker();
            modal.classList.remove('hidden');
        }

        function closeBookModal() {
            document.getElementById('book-modal').classList.add('hidden');
        }

        function setRating(rating) {
            document.getElementById('book-rating').value = rating;
            const container = document.getElementById('rating-stars');
            let html = '';
            for (let i = 1; i <= 5; i++) {
                html += `<button type="button" onclick="setRating(${i})" class="p-0.5 focus:outline-none">${getStarSvg(i <= rating, 'w-5 h-5')}</button>`;
            }
            container.innerHTML = html;
        }

        function saveBook(e) {
            e.preventDefault();
            const id = document.getElementById('book-id').value;
            const title = document.getElementById('book-title').value.trim();
            const author = document.getElementById('book-author').value.trim();
            const category = document.getElementById('book-category').value;
            const status = document.getElementById('book-status').value;
            const rating = parseInt(document.getElementById('book-rating').value);
            const startDate = document.getElementById('book-start-date').value;
            const cover = document.getElementById('book-cover').value.trim();
            const tags = [...selectedTagsForForm];

            if (id) {
                const index = books.findIndex(b => b.id === id);
                if (index !== -1) {
                    books[index] = { ...books[index], title, author, category, status, rating, startDate, tags, cover };
                }
            } else {
                const newBook = {
                    id: Date.now().toString(),
                    title,
                    author,
                    category,
                    status,
                    rating,
                    startDate,
                    tags,
                    cover
                };
                books.unshift(newBook);
            }

            localStorage.setItem('morandi_novel_books', JSON.stringify(books));
            closeBookModal();
            renderBooks();
            renderSubTagFilterBar();
            updateFinishedBookCount();
        }

        function openViewModal(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            const modal = document.getElementById('view-book-modal');
            const content = document.getElementById('view-modal-content');

            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += getStarSvg(i <= book.rating, 'w-4 h-4');
            }

            const coverHtml = book.cover 
                ? `<img src="${book.cover}" class="w-32 h-44 object-cover rounded-xl shadow-md flex-shrink-0 mx-auto sm:mx-0" onerror="this.src='https://placehold.co/300x400/DDC9B4/2A3D45?text=封面'">`
                : `<div class="w-32 h-44 bg-morandi-bg/50 border border-dashed border-morandi-primary rounded-xl flex flex-col items-center justify-center p-3 text-center flex-shrink-0 mx-auto sm:mx-0">
                        <svg class="w-8 h-8 text-morandi-blue mb-2" viewBox="0 0 80 80"><use href="#svg-hand-book"/></svg>
                        <span class="font-handwriting text-xs font-bold text-morandi-dark">${book.title}</span>
                   </div>`;

            const modalAuthorHtml = book.author
                ? `<span onclick="closeViewModal(); filterByAuthor('${book.author.replace(/'/g, "\\'")}')" class="cursor-pointer hover:underline hover:text-morandi-blue font-bold transition">作者：${book.author}</span>`
                : `<span>作者：未記載</span>`;

            content.innerHTML = `
                <div class="flex flex-col sm:flex-row gap-5 mb-5">
                    ${coverHtml}
                    <div class="flex-grow text-center sm:text-left">
                        <div class="flex items-center justify-center sm:justify-start gap-2 mb-2">
                            <span class="text-xs px-3 py-0.5 rounded-full bg-morandi-accent text-morandi-dark font-cute font-bold">${book.category || '未分類'}</span>
                            ${getStatusBadgeSvgHtml(book.status)}
                        </div>
                        <h2 class="text-xl font-handwriting font-bold text-morandi-dark mb-1">${book.title}</h2>
                        <p class="text-xs text-morandi-primary font-cute mb-3">${modalAuthorHtml}</p>
                        
                        <div class="flex items-center justify-center sm:justify-start gap-1 mb-4">
                            ${starsHtml}
                        </div>

                        <div class="text-xs text-morandi-dark space-y-1 font-cute bg-morandi-bg/50 p-3 rounded-xl border border-morandi-primary">
                            <div>閱讀日期：${book.startDate || '未紀錄'}</div>
                        </div>
                    </div>
                </div>

                ${book.tags && book.tags.length ? `
                <div class="pt-2 border-t border-morandi-primary/40">
                    <span class="text-xs font-cute text-morandi-primary block mb-1.5">子標籤：</span>
                    <div class="flex flex-wrap gap-1.5">
                        ${book.tags.map(t => `<span class="text-xs px-2.5 py-0.5 bg-morandi-bg/50 border border-morandi-primary rounded-lg text-morandi-dark font-cute"># ${t}</span>`).join('')}
                    </div>
                </div>
                ` : ''}
            `;

            document.getElementById('view-delete-btn').onclick = () => deleteBook(book.id);
            document.getElementById('view-edit-btn').onclick = () => {
                closeViewModal();
                openBookModal(book.id);
            };

            modal.classList.remove('hidden');
        }

        function closeViewModal() {
            document.getElementById('view-book-modal').classList.add('hidden');
        }

        function deleteBook(bookId) {
            books = books.filter(b => b.id !== bookId);
            localStorage.setItem('morandi_novel_books', JSON.stringify(books));
            closeViewModal();
            renderBooks();
            renderSubTagFilterBar();
            updateFinishedBookCount();
        }

        function openTabManageModal() {
            renderTabEditList();
            document.getElementById('tab-manage-modal').classList.remove('hidden');
        }

        function closeTabManageModal() {
            document.getElementById('tab-manage-modal').classList.add('hidden');
        }

        function renderTabEditList() {
            const container = document.getElementById('tab-edit-list');
            container.innerHTML = '';

            tabs.forEach((tab, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 bg-morandi-bg/50 p-2 rounded-xl border border-morandi-primary';
                
                const isSystemTab = tab.id === 'all';

                div.innerHTML = `
                    <input type="text" value="${tab.name}" id="tab-input-${index}" ${isSystemTab ? 'disabled' : ''} class="flex-grow px-3 py-1 bg-white border border-morandi-primary rounded-lg text-xs font-cute text-morandi-dark focus:outline-none focus:border-morandi-blue ${isSystemTab ? 'opacity-70 cursor-not-allowed' : ''}">
                    ${!isSystemTab ? `
                    <button onclick="deleteTabField(${index})" class="text-rose-400 hover:text-rose-600 p-1 text-xs">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    ` : `<span class="text-[10px] text-morandi-rose px-2 py-0.5 bg-morandi-accent rounded font-cute">預設分頁</span>`}
                `;
                container.appendChild(div);
            });
        }

        function addNewTabField() {
            tabs.push({ id: 'novel_cat_' + Date.now(), name: '新小說大類' });
            renderTabEditList();
        }

        function deleteTabField(index) {
            tabs.splice(index, 1);
            renderTabEditList();
        }

        function saveTabsConfig() {
            tabs.forEach((tab, index) => {
                const input = document.getElementById(`tab-input-${index}`);
                if (input && input.value.trim()) {
                    tab.name = input.value.trim();
                }
            });

            localStorage.setItem('morandi_novel_tabs', JSON.stringify(tabs));
            closeTabManageModal();
            renderTabs();
            renderCategorySelectOptions();
            renderBooks();
            renderSubTagFilterBar();
        }
    </script>
</body>
</html>
